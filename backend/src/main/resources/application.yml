spring:
  application:
    name: payguard-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/payguard
    username: payguard
    password: payguard_dev_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

payguard:
  jwt:
    secret: ${PAYGUARD_JWT_SECRET:change-this-development-secret-to-a-long-random-value}
    expiration-ms: 86400000
  business-zone: ${PAYGUARD_BUSINESS_ZONE:Asia/Kolkata}
  ml-service:
    base-url: ${PAYGUARD_ML_BASE_URL:http://localhost:8001}
    timeout-ms: 150
    failure-rate-threshold: 50
    sliding-window-size: 10
    wait-duration-in-open-state-seconds: 10
    minimum-number-of-calls: 5
  retraining:
    min-total-verdicts: 20
    min-per-class: 5
    # Sign convention: candidate is acceptable if candidate_pr_auc >= active_pr_auc + min-pr-auc-improvement-tolerance.
    # With tolerance = -0.02, candidate is acceptable if its PR-AUC is at least (active_pr_auc - 0.02),
    # meaning candidate PR-AUC may be up to 0.02 WORSE than active PR-AUC and still pass the activation gate.
    min-pr-auc-improvement-tolerance: -0.02
    timeout-ms: 120000

resilience4j:
  circuitbreaker:
    instances:
      mlService:
        failure-rate-threshold: 50
        sliding-window-size: 10
        wait-duration-in-open-state: 10s
        minimum-number-of-calls: 5
